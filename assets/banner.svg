<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3" />
    </linearGradient>
    <!-- Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="200" r="160" fill="#f43f5e" opacity="0.12" filter="url(#glow)" />

  <!-- Left Side: Branding -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="14" cy="14" r="4" fill="#10b981" />
    <text x="26" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">PI CODING AGENT</text>

    <!-- Main Title with Pi mark -->
    <g transform="translate(0, 50)">
      <!-- Pi Box Icon -->
      <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#primaryGrad)" />
      <text x="17" y="44" fill="#090d13" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900">π</text>

      <text x="80" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">pi-canvas</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="150" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Live Interactive Web Preview, UI Mockups &amp; Mermaid Canvas
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">⚡ SSE Hot Reload</text>

      <rect x="142" y="0" width="136" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="20" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold">📊 Mermaid 11</text>

      <rect x="290" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="304" y="20" fill="#10b981" font-family="monospace" font-size="13" font-weight="bold">🔒 Loopback Only</text>
    </g>
  </g>

  <!-- Right Side: Graphic Mockup Frame -->
  <g transform="translate(730, 60)">
    <!-- Browser/Canvas Window -->
    <rect x="0" y="0" width="390" height="270" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="390" height="36" rx="12" fill="#1e293b" />
    <path d="M0 24 h390 v12 h-390 z" fill="#1e293b" />
    <line x1="0" y1="36" x2="390" y2="36" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    
    <!-- Mock Address Bar -->
    <rect x="80" y="10" width="220" height="16" rx="8" fill="#0f172a" />
    <text x="96" y="22" fill="#64748b" font-family="monospace" font-size="10">http://127.0.0.1:4321</text>

    <!-- Canvas Inner Content Mockup -->
    <!-- Diagram nodes -->
    <rect x="30" y="60" width="90" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="46" y="82" fill="#e2e8f0" font-family="monospace" font-size="11">Client UI</text>

    <line x1="120" y1="78" x2="165" y2="78" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

    <rect x="165" y="60" width="100" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="180" y="82" fill="#e2e8f0" font-family="monospace" font-size="11">Agent API</text>

    <line x1="265" y1="78" x2="305" y2="78" stroke="#f59e0b" stroke-width="2" />

    <rect x="305" y="60" width="60" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="320" y="82" fill="#e2e8f0" font-family="monospace" font-size="11">SSE</text>

    <!-- Code Preview Card inside Mockup -->
    <rect x="30" y="120" width="335" height="120" rx="8" fill="#090d13" stroke="#1e293b" stroke-width="1" />
    <text x="45" y="146" fill="#f43f5e" font-family="monospace" font-size="11">pi.registerTool({</text>
    <text x="60" y="168" fill="#e2e8f0" font-family="monospace" font-size="11">name: <tspan fill="#38bdf8">'render_canvas'</tspan>,</text>
    <text x="60" y="190" fill="#e2e8f0" font-family="monospace" font-size="11">type: <tspan fill="#10b981">'mermaid'</tspan> | <tspan fill="#10b981">'html'</tspan></text>
    <text x="45" y="212" fill="#f43f5e" font-family="monospace" font-size="11">});</text>
  </g>
</svg>
